---
layout: default
---
<div class="max-w-[1300px] mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-10">
    
    <!-- Main Blog Feed Column (9 of 12 columns = 75% width) -->
    <div class="lg:col-span-9 lg:pr-8 lg:border-r lg:border-dotted lg:border-[#bbbbbb] min-w-0">
      <div class="space-y-16">
        {% for post in paginator.posts %}
          <article class="pb-10 border-b border-dotted border-[#bbbbbb]">
            
            <!-- Post Title -->
            <h2 class="font-serif font-normal text-3xl sm:text-[34px] leading-snug mb-2 text-[#29385b]">
              <a href="{{ post.url | relative_url }}" class="text-[#29385b] hover:text-[#d5ae65] hover:underline transition-colors">
                {{ post.title }}
              </a>
            </h2>

            <!-- Post Meta -->
            <div class="text-xs text-gray-500 mb-6 font-sans">
              By <span class="text-black">{{ post.author | default: "Rick Colosimo" }}</span> / {{ post.date | date: "%B %-d, %Y" }}
            </div>

            <!-- Post Excerpt -->
            <div class="text-[18px] leading-[1.6] text-[#424242] mb-6 font-sans">
              {{ post.excerpt }}
            </div>

            <!-- Read More Link -->
            <div class="text-right">
              <a href="{{ post.url | relative_url }}" class="post-read-more-link" aria-label="Read more about {{ post.title }}">
                Read More
              </a>
            </div>

          </article>
        {% endfor %}
      </div>

      <!-- Pagination -->
      {% include pagination.html %}
    </div>

    <!-- Sidebar Column (3 of 12 columns = 25% width) -->
    <div class="lg:col-span-3 min-w-0">
      {% include sidebar.html %}
    </div>

  </div>
</div>
