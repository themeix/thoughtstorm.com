<aside class="w-full lg:w-1/4 mt-10 lg:mt-0 lg:pl-8 space-y-8" aria-label="Sidebar">
  <!-- Search Widget -->
  <div class="widget">
    <form action="{{ '/search/' | relative_url }}" method="get" role="search">
      <input type="search" name="q" placeholder="Search" aria-label="Search" class="w-full px-4 py-3 bg-white border-2 border-gray-300 text-gray-700 text-base focus:border-[#23396c] focus:outline-none transition-colors" />
    </form>
  </div>

  <!-- All Blog Posts Button Widget -->
  <div class="widget">
    <a href="{{ '/' | relative_url }}" class="sidebar-all-posts-btn group">
      <span>All Blog Posts</span>
      <img src="{{ '/assets/uploads/2019/12/arrow-thin-wide-white.png' | relative_url }}" alt="" width="41" height="21" class="transform group-hover:translate-x-1 transition-transform" />
    </a>
  </div>

  <!-- Recent Posts Widget -->
  <div class="widget">
    <h4 class="font-serif text-[20px] text-[#29385b] pb-2 mb-3 border-b border-dotted border-[#bbbbbb]">Recent Posts</h4>
    <ul class="sidebar-list">
      {% for post in site.posts limit:5 %}
        <li>
          <a href="{{ post.url | relative_url }}" class="text-[#23396c] hover:text-[#d5ae65] hover:underline transition-colors leading-snug">
            {{ post.title }}
          </a>
        </li>
      {% endfor %}
    </ul>
  </div>

  <!-- Archives Dropdown Widget -->
  <div class="widget">
    <h4 class="font-serif text-[20px] text-[#29385b] pb-2 mb-3 border-b border-dotted border-[#bbbbbb]">Archives</h4>
    <label class="sr-only" for="sidebar-archives-select">Select Month</label>
    <select id="sidebar-archives-select" class="w-full px-4 py-2.5 bg-white border-2 border-gray-300 text-gray-700 text-sm focus:border-[#23396c] focus:outline-none" onchange="if(this.value) window.location.href=this.value;">
      <option value="">Select Month</option>
      <option value="{{ '/2025/11/' | relative_url }}">November 2025</option>
      <option value="{{ '/2025/04/' | relative_url }}">April 2025</option>
      <option value="{{ '/2024/07/' | relative_url }}">July 2024</option>
      <option value="{{ '/2020/02/' | relative_url }}">February 2020</option>
      <option value="{{ '/2018/03/' | relative_url }}">March 2018</option>
      <option value="{{ '/2017/02/' | relative_url }}">February 2017</option>
      <option value="{{ '/2016/05/' | relative_url }}">May 2016</option>
      <option value="{{ '/2016/03/' | relative_url }}">March 2016</option>
      <option value="{{ '/2016/02/' | relative_url }}">February 2016</option>
      <option value="{{ '/2015/05/' | relative_url }}">May 2015</option>
      <option value="{{ '/2014/03/' | relative_url }}">March 2014</option>
      <option value="{{ '/2013/08/' | relative_url }}">August 2013</option>
      <option value="{{ '/2013/05/' | relative_url }}">May 2013</option>
      <option value="{{ '/2013/04/' | relative_url }}">April 2013</option>
      <option value="{{ '/2013/01/' | relative_url }}">January 2013</option>
      <option value="{{ '/2012/07/' | relative_url }}">July 2012</option>
      <option value="{{ '/2012/06/' | relative_url }}">June 2012</option>
      <option value="{{ '/2012/05/' | relative_url }}">May 2012</option>
      <option value="{{ '/2011/05/' | relative_url }}">May 2011</option>
      <option value="{{ '/2011/02/' | relative_url }}">February 2011</option>
      <option value="{{ '/2010/12/' | relative_url }}">December 2010</option>
      <option value="{{ '/2010/11/' | relative_url }}">November 2010</option>
      <option value="{{ '/2010/10/' | relative_url }}">October 2010</option>
      <option value="{{ '/2010/09/' | relative_url }}">September 2010</option>
      <option value="{{ '/2010/08/' | relative_url }}">August 2010</option>
      <option value="{{ '/2010/05/' | relative_url }}">May 2010</option>
      <option value="{{ '/2010/04/' | relative_url }}">April 2010</option>
      <option value="{{ '/2009/12/' | relative_url }}">December 2009</option>
      <option value="{{ '/2009/11/' | relative_url }}">November 2009</option>
      <option value="{{ '/2009/06/' | relative_url }}">June 2009</option>
      <option value="{{ '/2009/04/' | relative_url }}">April 2009</option>
      <option value="{{ '/2009/03/' | relative_url }}">March 2009</option>
      <option value="{{ '/2009/02/' | relative_url }}">February 2009</option>
      <option value="{{ '/2009/01/' | relative_url }}">January 2009</option>
      <option value="{{ '/2008/12/' | relative_url }}">December 2008</option>
      <option value="{{ '/2008/11/' | relative_url }}">November 2008</option>
      <option value="{{ '/2008/10/' | relative_url }}">October 2008</option>
    </select>
  </div>
</aside>
